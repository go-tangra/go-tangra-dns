server:
  grpc:
    network: "tcp"
    addr: "0.0.0.0:9800"
    timeout: 30s
    middleware:
      enable_logging: true
      enable_recovery: true
      enable_tracing: false
      enable_validate: true
      enable_metadata: true

  http:
    network: "tcp"
    addr: "0.0.0.0:9801"
    timeout: 30s
