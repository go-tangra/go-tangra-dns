# dns configuration, rendered by the gateway's add-module wizard: every
# ${...} below was filled from the core's own configuration, so the issuer,
# trust domain and addresses match the core exactly.
service_name: dns
trust_domain: ${TRUST_DOMAIN}
# Not "production": production mode refuses file: secret references, and the
# warden references it requires cannot be resolved unattended yet (modules
# have no service-principal token; see deploy/README.md, "API keys"). The
# PowerDNS API keys are therefore file: references to keys generated on this
# host. Every other production guard is met explicitly below (verified TLS to
# the database and the core's Valkey, verified enrolment, no Docker socket).
env: dev
identity:
  provider: provided
mesh_enroll:
  enabled: true
  enroll_url: ${LCM_ENROLL_URL}
  lcm_grpc: ${LCM_GRPC}
  tenant_id: ${MESH_TENANT_ID}
  token_file: /tokens/enrollment.token
  state_file: /state/svid.json
  insecure: false
authz: { source: file, path: /app/policy.yaml }
server: { grpc_addr: 0.0.0.0:9965, http_addr: 0.0.0.0:9966 }
admin: { addr: 127.0.0.1:9850 }
discovery:
  static:
    gateway: ["${GATEWAY_GRPC}"]
    auth: ["${AUTH_GRPC}"]
    lcm: ["${LCM_GRPC}"]
limits: { max_request_bytes: 67174400 }
limits_dns: { max_request_bytes: 1048576, max_backup_bytes: 67108864, max_export_bytes: 33554432, max_page_size: 100 }
db:
  dsn: postgres://dns_app:${GEN_PASSWORD_2}@dns-db:5432/dns?sslmode=verify-full&sslrootcert=/tls/ca.pem
  migrate_dsn: postgres://postgres:${GEN_PASSWORD_1}@dns-db:5432/dns?sslmode=verify-full&sslrootcert=/tls/ca.pem
  max_conns: 16
# The core's event bus: zone and record events go to platform:events:<tenant>,
# which the gateway fans out to signed-in browsers.
valkey:
  addresses: ["${VALKEY_ADDRESS}"]
  username: dns
  password: "${VALKEY_PASSWORD}"
  allow_plaintext: false
  ca_file: /tls/valkey-ca.pem
kek: { source: env, env: DNS_KEK }
# The PowerDNS servers of this bundle. Their APIs have no TLS and are
# reachable on the compose network only (never published).
pdns:
  api_url: http://pdns-auth:8081
  server_id: localhost
  api_key_ref: file:/secrets/pdns-auth.key
  allow_plaintext: true
  auth_forward_host: pdns-auth
  auth_forward_port: 53
recursor:
  api_url: http://pdns-recursor:8082
  server_id: localhost
  api_key_ref: file:/secrets/pdns-recursor.key
  allow_plaintext: true
  reconcile_interval_seconds: 60
docker: { enabled: false }
managed_files:
  auth_path: /pdns-auth-conf/50-freya.conf
  recursor_path: /pdns-recursor-conf/50-freya.yml
# The optional "metrics" compose profile runs this Prometheus.
metrics: { prometheus_url: http://dns-prometheus:9090 }
# IPAM sync also calls ipam over the mesh, whose address the gateway does not
# fill in: off here.
ipam_sync: { enabled: false }
acme: { allowed_caller: spiffe://${TRUST_DOMAIN}/svc/lcm }
secrets: { warden_service: warden, refresh_seconds: 300 }
events: { enabled: true }
gateway: { service: gateway, issuer: ${GATEWAY_ISSUER} }
