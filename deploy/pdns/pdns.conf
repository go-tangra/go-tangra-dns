# Freya dev stack: base configuration of the shared PowerDNS Authoritative
# server (mounted read-only as /etc/powerdns/pdns.conf). Everything
# operator-tunable lives in the include directory, which is the shared
# pdns-auth-conf volume:
#   00-api.conf    written ONCE by dns-secrets-init (webserver + API key; the
#                  API listens on the internal compose network only)
#   50-freya.conf  rendered by the dns module from the saved Configuration
#                  (managed_files.auth_path; "Managed by Freya DNS")
# Include files are read in name order; a later file overrides an earlier one.
launch=gsqlite3
gsqlite3-dnssec
gsqlite3-database=/var/lib/powerdns/pdns.sqlite3
local-address=0.0.0.0
local-port=53
# Primary for master/producer zones (NOTIFY from the zone drawer); accept
# NOTIFY/AXFR only as configured through the managed file.
primary=yes
secondary=no
disable-axfr=no
allow-axfr-ips=127.0.0.1
# Zone default SOA (the module writes its own apex NS from the zone's nameservers).
default-soa-content=ns1.@ hostmaster.@ 0 10800 3600 604800 3600
# The Prometheus /metrics endpoint of the webserver (scraped by the optional
# "metrics" compose profile) needs no password inside the network.
loglevel=4
include-dir=/etc/powerdns/pdns.d
