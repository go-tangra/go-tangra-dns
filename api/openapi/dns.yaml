        the caller's or full is platform-admin only.
      x-freya-permission: 'backup:manage'
      x-freya-max-body-bytes: 67108864
      x-freya-timeout-seconds: 300
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backup]
              additionalProperties: false
              properties:
                mode: { type: string, enum: [skip, overwrite] }
                tenant_id: { type: string, format: uuid }
                full: { type: boolean }
                backup: { type: object }
      responses:
        '200':
          description: 'import summary'
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  mode: { type: string }
                  imported: { type: object, additionalProperties: { type: integer } }
                  skipped: { type: object, additionalProperties: { type: integer } }
