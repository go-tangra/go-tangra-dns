tags:
    - name: DnsConfigService
      description: |-
        DnsConfigService manages platform-level configuration for the PowerDNS
         Recursor (the client-facing resolver) and the Authoritative server.
         Updates are persisted, rendered into each service's include-dir config
         file, and applied by restarting the affected container.
    - name: DnsDashboardService
      description: |-
        DnsDashboardService — a thin proxy in front of Prometheus. The frontend
         issues PromQL through these RPCs so the Prometheus API stays out of the
         browser (no CORS, no auth bypass) and dashboard data flows through the
         same admin gateway as the rest of the module. Both calls fan out to
         /api/v1/query{,_range} on the configured Prometheus instance.
    - name: DnsRecordService
      description: |-
        Record Service — manages DNS records within a zone.
         Records are not stored locally; all operations proxy to PowerDNS.
    - name: DnsSupermasterService
      description: |-
        Supermaster Service — for AXFR-based SLAVE zone replication.
         Supermasters tell PowerDNS which IPs are allowed to send NOTIFY
         and initiate automatic SLAVE zone provisioning.
    - name: DnsZoneService
      description: Zone Service — manages PowerDNS zones (forward + reverse).
    - name: DnsZoneTemplateService
      description: |-
        Zone Template Service — Poweradmin-style reusable zone templates.
         Each template defines a set of record templates with placeholders
         like [ZONE] that get expanded when creating a zone.
